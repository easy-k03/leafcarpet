name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Paperweight
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/paperweight
          key: ${{ runner.os }}-paperweight-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-paperweight-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew build --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

      - name: List built jars
        if: always()
        run: ls -lh build/libs || true

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: leafcarpet
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev*.jar
            !build/libs/*-plain.jar
            !build/libs/*-reobf.jar
